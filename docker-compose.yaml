services:
  db:
    container_name: db
    image: postgres:latest
    volumes:
      - ./psql:/var/lib/postgresql
    environment:
      - POSTGRES_DB=$DB_NAME
      - POSTRGES_USER=$DB_USER
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_pw
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
      interval: 10s
      timeout: 1s
      retries: 5
      start_period: 30s
    restart: always
    secrets:
      - db_pw

  migrations:
    image: migrate/migrate:4
    volumes:
      - ./migrations:/migrations
    entrypoint: ["/bin/sh", "-c"]
    environment:
      - POSTGRES_DB=$DB_NAME
      - POSTRGES_USER=$DB_USER
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_pw
    command:
      - >
        migrate -path /migrations -database "postgres://$$POSTRGES_USER:$$(cat $$POSTGRES_PASSWORD_FILE)@db:5432/$$POSTGRES_DB?sslmode=disable" up
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db_pw

  app:
    container_name: app
    build: app
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      - POSTGRES_DB=$DB_NAME
      - POSTRGES_USER=$DB_USER
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_pw
    ports:
      - ${APP_PORT}:8080
    healthcheck: 
      test: ["CMD", "wget", "--spider", "-q" , "http://localhost:8080/health_check"]
      interval: 15s
      timeout: 0.1s
      retries: 10
      start_period: 15s
    restart: always
    secrets:
      - db_pw
secrets:
  db_pw:
    file: ${DB_PW_FILE}